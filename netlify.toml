# 스타핏픽 — Netlify 배포 설정
# 정적 HTML 사이트를 저장소 루트 그대로 배포합니다 (빌드 단계 없음).

[build]
  publish = "."

# HTML은 항상 최신본을 확인 (검색엔진·공유 미리보기 갱신)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 이미지·폰트 등 정적 자산은 길게 캐시 (교체 시 ?v= 값 올리기)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# 검색엔진 확인 파일·사이트맵은 캐시하지 않음
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=600"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Cache-Control = "public, max-age=600"
    Content-Type = "application/rss+xml; charset=utf-8"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
