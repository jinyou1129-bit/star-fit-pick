<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>390 QA</title>
<style>
  html,body{margin:0;background:#d9dde3;font:12px/1.4 -apple-system,sans-serif}
  .stage{display:flex;justify-content:center;align-items:flex-start;padding:24px 0}
  .phone{width:390px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18)}
  iframe{display:block;width:390px;height:740px;border:0}
</style>
</head>
<body>
<div class="stage"><div class="phone">
<iframe id="m" title="mobile" src="./?v=3"></iframe>
</div></div>
<script>
  var q = new URLSearchParams(location.search);
  var p = q.get("src");
  var sel = q.get("sel");
  var f = document.getElementById("m");
  if (p) f.src = p;
  if (sel) f.onload = function () {
    try { var el = f.contentDocument.querySelector(sel); if (el) el.scrollIntoView({block: "start"}); } catch (e) {}
  };
</script>
</body>
</html>
