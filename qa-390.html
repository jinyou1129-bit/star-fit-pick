<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>390 QA</title>
<style>
  html,body{margin:0;padding:0;background:#dfe3e8;height:100%}
  #f{width:390px;height:920px;border:0;display:block;background:#fff;margin:0}
</style>
</head>
<body>
<iframe id="f" src="about:blank" title="390px preview"></iframe>
<script>
  var f = document.getElementById('f');
  f.src = 'index.html?qa=1&t=' + Date.now();
  window.qaScroll = function (y) { f.contentWindow.scrollTo(0, y || 0); };
  window.qaModal = function (id) {
    var d = f.contentDocument;
    var a = d.querySelector('[data-id="' + id + '"] a.card-media');
    if (a) a.click();
  };
  window.qaClose = function () {
    var d = f.contentDocument;
    var b = d.getElementById('modal-close');
    if (b) b.click();
  };
</script>
</body>
</html>
