<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>QA 390 하네스</title>
<style>
  body{margin:0;background:#e9edf1;font:13px/1.4 -apple-system,sans-serif}
  .bar{display:flex;gap:10px;padding:10px;background:#111;color:#fff;align-items:center;flex-wrap:wrap}
  .bar a{color:#fff;border:1px solid #555;border-radius:8px;padding:5px 10px;text-decoration:none}
  .bar b{font-weight:700}
  .stage{padding:16px;display:flex;justify-content:center}
  iframe{width:390px;height:900px;border:0;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.18)}
</style>
</head>
<body>
<div class="bar">
  <b>390px QA</b>
  <a href="#" data-src="personal-color.html">top</a>
  <a href="#" data-src="personal-color.html?tone=spring#result">spring</a>
  <a href="#" data-src="personal-color.html?tone=summer#result">summer</a>
  <a href="#" data-src="personal-color.html?tone=autumn#result">autumn</a>
  <a href="#" data-src="personal-color.html?tone=winter#result">winter</a>
  <a href="#" data-src="personal-color.html#tones">tones</a>
  <a href="#" data-src="personal-color.html#how">how</a>
  <span id="stat"></span>
</div>
<div class="stage"><iframe id="f" src="personal-color.html"></iframe></div>
<script>
  var f = document.getElementById("f");
  document.addEventListener("click", function (e) {
    var a = e.target.closest("a[data-src]");
    if (!a) return;
    e.preventDefault();
    f.src = a.getAttribute("data-src");
  });
  setInterval(function () {
    try {
      var d = f.contentDocument;
      if (!d) return;
      var de = d.documentElement;
      document.getElementById("stat").textContent =
        "scrollWidth " + de.scrollWidth + " / clientWidth " + de.clientWidth +
        " · h " + de.scrollHeight;
    } catch (err) {}
  }, 800);
</script>
</body>
</html>
