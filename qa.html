<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA · 390px</title>
<meta name="robots" content="noindex,nofollow">
<style>
body{margin:0;background:#cfcac1;font-family:system-ui,sans-serif;display:flex;gap:22px;padding:14px;align-items:flex-start}
figure{margin:0}
iframe{width:390px;height:844px;border:0;background:#fff;display:block}
figcaption{font-size:12px;color:#333;padding:4px 2px}
</style>
</head>
<body>
<figure><iframe id="f1" src="./?cb=q1" title="390 top"></iframe><figcaption>390 · hero</figcaption></figure>
<figure><iframe id="f2" src="./?cb=q2#looks" title="390 grid"></iframe><figcaption>390 · grid</figcaption></figure>
<figure><iframe id="f3" src="./?cb=q3&amp;look=jiwon-aloro-velvet" title="390 modal"></iframe><figcaption>390 · modal</figcaption></figure>
<script>
function prep(f, fn){
  f.addEventListener('load', function(){
    try{
      var d = f.contentDocument, w = f.contentWindow;
      var s = d.createElement('style');
      s.textContent = 'html{scrollbar-width:none}::-webkit-scrollbar{width:0;height:0}';
      d.head.appendChild(s);
      var scr = fn && fn(w, d);
      if (scr) w.scrollTo(0, scr);
    }catch(e){}
  });
}
prep(document.getElementById('f2'), function(w, d){
  var g = d.querySelector('#look-grid');
  return g ? g.getBoundingClientRect().top + w.scrollY - 96 : 0;
});
</script>
</body>
</html>
